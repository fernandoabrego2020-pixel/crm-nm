<div id="mapv">
  <div id="mtop"><button id="mback">← Leads</button><b id="mtt">Mapa</b><div id="mseg"><button data-md="pros">Prospectos</button><button data-md="rutas">Rutas</button></div></div>

  <div class="mfs" id="mrs"><div class="mh"><b>Rutas de cambaceo</b><button id="mrx" aria-label="Cerrar">×</button></div><label class="note"><input type="checkbox" id="mrshow" checked style="width:auto;padding:0"> Mostrar rutas en el mapa</label><div class="note" id="mrn"></div><div class="res" id="mrr"></div></div>

<script>
const H=3600e3,D=24*H;
const AG=['Fer','Lerma Zayuri','Lerma Mario','Lerma Leo','Santiago Katy','Santiago Maggy','Valle Andrea','Valle Carlos','Valle Aodes Karla','Atlacomulco','Almoloya','Tenancingo Alexis','Tenancingo Toño'];
const ACC={Fer:'fer','Lerma Zayuri':'lerma','Lerma Mario':'lerma','Lerma Leo':'lerma','Santiago Katy':'santiago','Santiago Maggy':'santiago','Valle Andrea':'valle','Valle Carlos':'valle','Valle Aodes Karla':'aodes',Atlacomulco:'atlacomulco',Almoloya:'almoloya','Tenancingo Alexis':'tenancingo','Tenancingo Toño':'tenancingo'};
const REN={Zayuri:'Lerma Zayuri',Lerma:'Lerma Zayuri',Mario:'Lerma Mario',Santiago:'Santiago Katy',Tenancingo:'Tenancingo Alexis','Valle de Bravo':'Valle Andrea',Aodes:'Valle Aodes Karla',Maggy:'Santiago Maggy'};
let SP='',LMODE='enter',LFIRST='',UNDO_ADD=false,FULL=false,FULLS=true;
const PROT=n=>n==='Administrativo';
const NEEDPIN=new Set(['mv','rm','back']);const FREEA=new Set(['nxw','nxv','locmap']);const free0=f=>f();let LASTAG={};
function isFull(){try{const b=TOK.split('.')[0].replace(/-/g,'+').replace(/_/g,'/');return FULLS&&atob(b+'='.repeat((4-b.length%4)%4)).split('|')[2]==='f'}catch(e){return false}}
function lgTitle(m){const c=document.getElementById('ct');if(!c)return;c.innerHTML=m==='create'?'Crear NIP<small>Elige 4 a 8 números. Úsalo siempre que entres.</small>':m==='repeat'?'Repite tu NIP<small>Escríbelo otra vez para confirmar</small>':''}
async function lgProbe(){try{const r=await api('login',{name:LU,pin:''});if(r.err==='setpin'&&document.getElementById('ct')&&LMODE==='enter'){LMODE='create';lgTitle('create')}}catch(e){}}
async function viewLogin(n){
  try{const r=await api('login',{name:n,view:1});if(r.err){LU=n;showLogin('Entra con tu NIP');return}
    TOK=r.token;ME=r.name;LU=ME;lset('crm-tok',TOK);lset('crm-user',ME);saveTok(ME,TOK);
    const x=await pull();if(x==='err'||x==='auth'){showLogin('No se pudo cargar los datos');return}
    finishBoot();
  }catch(e){showLogin('Sin conexión')}
}

function bkpSet(){try{if(TOK&&ME)google.script.history.replace(null,null,'s='+encodeURIComponent(ME+'|'+(LR||'')))}catch(e){}}
function bkpClr(){try{google.script.history.replace(null,null,'')}catch(e){}}
function bkpGet(){return new Promise(res=>{let d=0;const f=v=>{if(!d){d=1;res(v)}};setTimeout(()=>f(''),1500);try{google.script.url.getLocation(l=>{try{const m=/s=([^&]*)/.exec((l&&l.hash)||'');f(m?decodeURIComponent(m[1]):'')}catch(e){f('')}})}catch(e){f('')}})}
let PM=null;
function needFull(cb){
  if(isFull()){FULL=true;return cb()}
  let m=document.getElementById('pm');
  if(!m){m=document.createElement('div');m.id='pm';document.body.appendChild(m)}
  PM={cb:cb,mode:'enter',first:''};
  const ks=['1','2','3','4','5','6','7','8','9','del','0','go'].map(k=>`<button class="kk ${k==='go'?'ok':''}" data-pk="${k}">${k==='del'?'\u232B':k==='go'?'\u2713':k}</button>`).join('');
  m.innerHTML=`<button class="x" data-pk="x">Cancelar</button><div class="lg2"><div class="ct" id="pmt">Pon tu NIP<small>Para hacer cambios en prospectos y en el sistema. Se pide una vez por celular</small></div><div class="dots" id="pmd"></div><div class="lm" id="pme"></div><input type="hidden" id="pmv" value=""><div class="kp">${ks}</div></div>`;
  m.style.display='flex';pmDraw();
  api('login',{name:ME,pin:''}).then(r=>{if(PM&&r.err==='setpin'){PM.mode='create';pmTitle()}}).catch(()=>{});
}
function askFull(){return new Promise(res=>{needFull(()=>res(true));if(PM)PM.cancel=()=>res(false)})}
function pmTitle(){const t=document.getElementById('pmt');if(!t||!PM)return;t.innerHTML=PM.mode==='create'?'Crear NIP<small>Elige 4 a 8 números. Solo te lo pido para mover de cuenta, borrar o prender y apagar. Una vez por celular.</small>':PM.mode==='repeat'?'Repite tu NIP<small>Escríbelo otra vez para confirmar</small>':'Pon tu NIP<small>Para hacer cambios en prospectos y en el sistema. Se pide una vez por celular</small>'}
function pmDraw(){const i=document.getElementById('pmv'),d=document.getElementById('pmd');if(!i||!d)return;const v=i.value.length,n=Math.max(4,v);d.innerHTML=Array.from({length:n},(_,k)=>`<i class="${k<v?'f':''}"></i>`).join('')}
function pmClose(){const m=document.getElementById('pm');if(m)m.style.display='none';PM=null}
async function pmKey(k){
  if(!PM)return;if(k==='x'){const cc=PM.cancel;pmClose();if(cc)cc();return}
  const i=document.getElementById('pmv'),e=document.getElementById('pme');let v=i.value;
  if(k==='del')v=v.slice(0,-1);else if(k!=='go'){if(v.length<8)v+=k}
  i.value=v;e.textContent='';pmDraw();
  if(k!=='go')return;
  if(PM.mode==='create'){if(!/^\d{4,8}$/.test(v)){e.textContent='4 a 8 números';return}PM.first=v;PM.mode='repeat';i.value='';pmDraw();pmTitle();return}
  if(PM.mode==='repeat'){if(v!==PM.first){PM.mode='create';PM.first='';i.value='';pmDraw();pmTitle();e.textContent='No coinciden, elige otra vez';return}}
  if(!v){e.textContent='Escribe tu NIP';return}
  e.textContent='Revisando…';
  try{
    const r=await api('login',{name:ME,pin:v,setpin:PM.mode==='repeat'});
    if(r.err){e.textContent=r.err==='pin'?'NIP incorrecto':r.err==='lock'?'Espera 10 min':r.err==='setpin'?'Primero crea tu NIP':'No se pudo';i.value='';pmDraw();if(r.err==='setpin'){PM.mode='create';pmTitle()}return}
    TOK=r.token;FULL=true;FULLS=true;saveTok(ME,TOK);lset('crm-tok',TOK);bkpSet();const cb=PM.cb;pmClose();cb();
  }catch(x){e.textContent='Sin conexión'}
}
const G=[
 {id:'empezar',t:'Preguntar uso',k:'g1'},
 {id:'ofrecer',t:'Mandar fotos',k:'g3'},
 {id:'referidos',t:'Pedir referidos',k:'g2'},
 {id:'aprobar',t:'Buscar aprobación',k:'g4'},
 {id:'visita',t:'Buscar visita',k:'g5'},
 {id:'vendidos',t:'Caducidad promoción',k:'g6'},
 {id:'apartar',t:'Apartar o firmar',k:'g8'}
];
const CART={id:'cartera',t:'Cartera',k:'g7'};
const GRID=[G[0],G[1],G[2],CART,G[3],G[4],G[5],G[6]];
const NX={empezar:'→',ofrecer:'↙',aprobar:'→',visita:'→',vendidos:'→',apartar:'✓'};
const ST=['Azteca/Coppel','Galgo','Maxicash','Atrato','Familiar','Seg. familiar'];
const MOTOS=['Titan 300','Raven 200','Trapper 150'];
const gb=id=>id==='cartera'?CART:G.find(g=>g.id===id);

let S={ag:AG[0],leads:[]},undo=null,open=null,only=null,sheet=null,AI=false,tt,TOK='',ME='',LU='',BASE=new Map(),pushing=false,again=false,ready=false,ADMIN=false,TAKEN=new Map(),delArm=null,NXM='w';
const ANA_OK=false;
if(!AG.includes(S.ag))S.ag=AG[0];
const save=()=>{push()};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago=t=>{const h=(Date.now()-t)/H;return h<1?Math.max(1,Math.round(h*60))+' min':h<24?Math.round(h)+' h':Math.round(h/24)+' d'};
const mine=()=>S.leads.filter(l=>l.own===S.ag&&!l.ph);const phN=()=>S.leads.filter(l=>l.ph&&l.own===S.ag).length;const phNext=()=>Math.max(phN(),...S.leads.filter(l=>l.ph&&l.own===S.ag).map(l=>l.pn||0))+1;let QSBUSY=false;
const inG=(l,id)=>l.st[id]!==undefined;
const live=l=>!l.vz&&(!l.sn||l.sn<=Date.now());
const inA=(l,id)=>inG(l,id)&&(id==='referidos'||live(l));
const fd=t=>new Date(t).toLocaleDateString('es-MX',{day:'numeric',month:'short'});
const ymd=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const FLOW=['empezar','ofrecer','aprobar','visita','apartar','vendidos'];
const ETP=G.filter(g=>g.id!=='referidos');
const EID=ETP.map(g=>g.id);
function backBlock(l,g){
  let opts,def;
  if(g.id==='cartera'){if(EID.some(k=>inG(l,k)))return '';opts=EID;def=l.done?'apartar':'empezar'}
  else{const i=EID.indexOf(g.id);if(i<1)return '';opts=EID.slice(0,i);def=EID[i-1]}
  return `<div class="sn"><div class="note">¿Lo picaste por error o quedó mal clasificado? Regrésalo a otra fase</div><div class="sub2"><select id="bksel">${opts.map(k=>`<option value="${k}"${k===def?' selected':''}>${gb(k).t}</option>`).join('')}</select><button class="b" data-a="back">Regresar</button></div></div>`
}
function setStage(l,id){if(!id||id==='empezar'||!ETP.some(g=>g.id===id))return;l.st={};l.st[id]=Date.now();l.st.referidos=Date.now();if(id==='aprobar')l.s=0;(l.ctx=l.ctx||[]).push({t:Date.now(),x:'La IA lo acomodó en '+gb(id).t+' según la foto.',auto:true,pend:false})}
function wake(){let c=0;S.leads.forEach(l=>{if(l.sn&&l.sn<=Date.now()){Object.keys(l.st).forEach(k=>{l.st[k]=l.sn});delete l.sn;c++}
  const ks=FLOW.filter(k=>l.st[k]!==undefined);if(ks.length>1){const keep=ks[ks.length-1];ks.forEach(k=>{if(k!==keep)delete l.st[k]});c++}});if(c)save()}
const add=(l,id)=>{if(!inG(l,id))l.st[id]=Date.now()};
const del=(l,...ids)=>ids.forEach(id=>{delete l.st[id]});
const touch=l=>{Object.keys(l.st).forEach(k=>{l.st[k]=Date.now()})};
const norm=t=>{const d=String(t).replace(/\D/g,'');return d.length>10?d.slice(-10):d};
const uid=()=>'L'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ev=(l,x)=>{(l.ctx=l.ctx||[]).push({t:Date.now(),x,auto:true,pend:true})};
const newLead=(own,name,moto,tel,ctx,idf)=>{const n=Date.now();const l={id:uid(),own,src:ACC[own]||null,name,moto,tel,c:n,s:0,f:0,r:0,note:'',done:false,ctx:ctx?[{t:n,x:ctx,pend:true}]:[],st:{empezar:n,referidos:n}};if(idf)l.idf=idf;return l};
const fmt=t=>t&&t.length===10?t.slice(0,3)+' '+t.slice(3,6)+' '+t.slice(6):(t||'');
const dupMsg=(d)=>{const n=d.name?' ('+d.name+')':'';return d.own===S.ag?'Ya lo tienes agregado'+n:'Ya está en la cuenta de '+d.own+n};
const findDup=t=>S.leads.find(x=>x.tel===t)||(TAKEN.has(t)?{own:TAKEN.get(t),name:''}:null);

function tags(l,g){
  const t=[];
  if(g.id==='aprobar')t.push(['Falta '+ST[l.s]]);
  if(g.id==='visita'&&l.note)t.push([l.note]);
  if(g.id==='referidos')t.push([(l.r||0)+'/3']);
  if(l.ctx&&l.ctx.some(e=>!e.auto))t.push(['Contexto']);
  if(g.id==='cartera'){if(l.vz)t.push(['Para visitar']);else if(!live(l))t.push(['Vuelve '+fd(l.sn)]);const k=G.filter(x=>inG(l,x.id)).map(x=>x.t);(k.length?k:[l.lost?'Perdido':'Cerrado']).forEach(x=>t.push([x]))}
  else if(l.f&&g.id!=='referidos')t.push([l.f>=4?'Llamar':'Seg. '+l.f+'/3',1]);
  return t.map(([x,w])=>`<span class="t${w?' w':''}">${esc(x)}</span>`).join('');
}
function snzBlock(){
  const v=NXM==='v';
  const sw=`<div class="seg"><button data-a="nxw" class="${v?'':'on'}">Escribir</button><button data-a="nxv" class="${v?'on':''}">Visitar</button></div>`;
  if(v)return `<div class="sn"><div class="note">Siguiente seguimiento</div>${sw}<div class="note">Sale de aquí y queda en Cartera; aparece en el mapa como pendiente de visita, para cuando salgas a cambacear.</div><button class="b p" data-a="vz">Visitar cuando salga</button></div>`;
  return `<div class="sn"><div class="note">Siguiente seguimiento: escribirle en… (sale de aquí y queda en Cartera)</div>${sw}<div class="chips2"><button class="b" data-a="sn1">Mañana</button><button class="b" data-a="sn3">3 días</button><button class="b" data-a="sn7">7 días</button><button class="b" data-a="sn14">14 días</button></div><div class="sub2"><input type="date" id="sd" min="${ymd(1)}"><button class="b" data-a="snd">Escoger día</button></div></div>`;
}
function locBlock(l){
  return `<div class="sn"><div class="note">${l.loc?'Ubicación guardada el '+fd(l.loc[3])+' (±'+l.loc[2]+' m)':'Sin ubicación guardada'}</div><div class="sub2"><button class="b" data-a="loc">${l.loc?'Actualizar ubicación aquí':'Guardar ubicación aquí'}</button>${l.loc?'<button class="b" data-a="locmap">Ver en mapa</button>':''}</div></div>`;
}

function classify(f,seen){
  f.dup=false;f.msg='';const t=norm(f.tel);
  if(t.length===10){const d=findDup(t);if(d){f.dup=true;f.msg=dupMsg(d)}else if(seen.has(t)){f.dup=true;f.msg='Repetido en la foto'}seen.add(t)}
  else f.msg=t?'WhatsApp incompleto (10 dígitos)':'Falta el WhatsApp';
  if(!f.name&&!f.dup)f.msg=f.msg||'Falta el nombre';
  f.on=!f.dup&&t.length===10&&!!f.name;return f;
}

function mList(){const d=MV.d;if(!d)return[];const qs=MV.q.toLowerCase().split(/\s+/).filter(Boolean).map(mnorm).filter(Boolean);const si=MV.s?MSUC.findIndex(x=>x[0]===MV.s):-1;

    const vm=fm==='visit',pm=fm==='ph',dd=l=>l.loc&&me?Math.hypot(mx(l.loc[1])-mx(me[1]),my(l.loc[0])-my(me[0])):1e12;
    const L=S.leads.filter(l=>l.own===S.ag&&(pm?l.ph:vm?l.vz:!l.loc)&&(!q||String(l.name||'').toLowerCase().includes(q)||(d&&String(l.tel).includes(d)))).sort((a,b)=>vm&&me?dd(a)-dd(b):b.c-a.c).slice(0,40);
    $('mfr').innerHTML=L.length?L.map(l=>l.ph?`<button class="mrow" data-id="${l.id}">Sin datos<small>Guardado ${ago(l.c)} · ±${l.loc[2]} m</small></button>`:`<button class="mrow" data-id="${l.id}">${esc(l.name)}<small>${esc(fmt(l.tel))} · ${PN[baseOf(l)]}${vm&&!l.loc?' · sin ubicación':''}</small></button>`).join(''):'<div class="note">'+(vm?'No hay leads pendientes de visita.':'No hay leads sin ubicación con esa búsqueda.')+'</div>';
  }
  function openFind(m){fm=m;$('mft').textContent=m==='ph'?'Guardados sin datos':m==='visit'?'Por visitar':'Ubicar un lead que no tiene ubicación';$('mfn').textContent=m==='ph'?'Toca uno para verlo en el mapa y llenar sus datos.':m==='visit'?'Toca el lead para verlo en el mapa. Si ya diste Ubicarme, salen del más cercano al más lejano.':'Toca el lead y se guarda tu ubicación actual para él.';$('mfq').value='';renderFind();$('mfs').className='mfs show'}
  function closeFind(){$('mfs').className='mfs'}
  function assign(id){
    const l=S.leads.find(x=>x.id===id);if(!l)return;
    closeFind();free0(()=>{say('Ubicando a '+l.name+'…');
    gps(c=>{
      l.loc=rl(c.latitude,c.longitude,c.accuracy);save();center(c);showCard(l);draw();
      say('Ubicación guardada para '+l.name+' (±'+Math.round(c.accuracy)+' m).');
    },e=>say('Sin ubicación. '+((e&&e.message)||'')));
    });
  }
  function init(){
    if(inited)return;inited=true;
    cv=$('mc');cx=cv.getContext('2d');
    $('mback').onclick=hide;
    document.querySelectorAll('#mseg [data-md]').forEach(b=>b.onclick=()=>setMode(b.dataset.md));
    $('mloc').onclick=()=>{
      const b=$('mloc');b.disabled=true;say('Ubicándote (no se guarda)…');
      gps(c=>{b.disabled=false;me=[c.latitude,c.longitude,c.accuracy];center(c);draw();say('Estás aquí (±'+Math.round(c.accuracy)+' m). No se guardó.')},e=>{b.disabled=false;say('Sin ubicación. '+((e&&e.message)||''))});
    };
    $('msave').onclick=()=>{
      const b=$('msave');b.disabled=true;say('Pidiendo ubicación…');
      if(FERDEV()){gps(c=>{b.disabled=false;const n=Date.now(),id=uid(),loc=rl(c.latitude,c.longitude,c.accuracy),l={id:id,own:S.ag,src:ACC[S.ag]||null,name:'',moto:'',tel:'ph'+id.toLowerCase(),c:n,s:0,f:0,r:0,note:'',done:false,ctx:[],st:{},ph:1,pn:phNext(),loc:loc};UNDO_ADD=true;undo=JSON.stringify(S);S.leads.push(l);center(c);draw();done('Guardado '+l.pn);say('Guardado como n\u00famero '+l.pn+'. D\u00edctaselo a la IA para llenarlo.')},e=>{b.disabled=false;say('Sin ubicaci\u00f3n. '+((e&&e.message)||''))});return}
      gps(c=>{b.disabled=false;pend=rl(c.latitude,c.longitude,c.accuracy);center(c);hideCard();draw();say('Ubicación lista (±'+Math.round(c.accuracy)+' m). Captura el lead.');openSheet(pend)},e=>{b.disabled=false;say('Sin ubicación. '+((e&&e.message)||''))});
    };
    $('mph').onclick=()=>openFind('ph');$('mfind').onclick=()=>openFind('find');$('mvis').onclick=()=>openFind('visit');
    $('mfx').onclick=closeFind;
    try{buf=JSON.parse(lget('crm-rbuf')||'[]')}catch(e){buf=[]}
    $('mtrk').onclick=()=>{if(trk)stopTrk('Ruta detenida y guardada.');else startTrk()};
    $('mrts').onclick=()=>{renderR();$('mrs').className='mfs show'};
    $('mrx').onclick=()=>{$('mrs').className='mfs'};
    $('mrshow').onchange=e=>{showR=e.target.checked;draw()};
    $('mrr').onclick=e=>{const b=e.target.closest('.mrow');if(!b)return;const r=routes().find(x=>x.dia===b.dataset.d);if(!r)return;$('mrs').className='mfs';fitR(r)};
    document.addEventListener('visibilitychange',()=>{if(document.hidden||!trk)return;wake();if(!lastP||Date.now()-lastP[3]>15e4)tick();flush()});
    window.addEventListener('online',flush);
    $('mfq').oninput=renderFind;
    $('mfr').onclick=e=>{const b=e.target.closest('.mrow');if(!b)return;if(fm==='visit'||fm==='ph'){const l=S.leads.find(x=>x.id===b.dataset.id);closeFind();if(!l)return;if(!l.loc){say('Ese lead no tiene ubicación. Usa Ubicar lead cuando estés con él.');return}V.cx=mx(l.loc[1]);V.cy=my(l.loc[0]);V.s=Math.max(V.s,0.5);showCard(l);draw();return}assign(b.dataset.id)};
    cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);const r=cv.getBoundingClientRect(),p=[e.clientX-r.left,e.clientY-r.top];ptr[e.pointerId]=p;last2=0;if(Object.keys(ptr).length===1){moved=0;down0=p}else moved=99});
    cv.addEventListener('pointermove',e=>{
      if(!ptr[e.pointerId])return;
      const r=cv.getBoundingClientRect(),n=[e.clientX-r.left,e.clientY-r.top],ids=Object.keys(ptr);
      if(ids.length===1){const o=ptr[e.pointerId];moved+=Math.abs(n[0]-o[0])+Math.abs(n[1]-o[1]);V.cx-=(n[0]-o[0])/V.s;V.cy+=(n[1]-o[1])/V.s;draw()}
      else if(ids.length===2){
        const other=ptr[ids[0]]===ptr[e.pointerId]?ptr[ids[1]]:ptr[ids[0]],d=Math.hypot(n[0]-other[0],n[1]-other[1]);
        if(last2)zoomAt((n[0]+other[0])/2,(n[1]+other[1])/2,d/last2);last2=d;
      }
      ptr[e.pointerId]=n;
    });
    cv.addEventListener('pointerup',e=>{if(moved<8&&down0)tap(down0);delete ptr[e.pointerId];last2=0;down0=null});
    cv.addEventListener('pointercancel',e=>{delete ptr[e.pointerId];last2=0;down0=null});
    cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.2:1/1.2)},{passive:false});
    window.addEventListener('resize',()=>{if(shown)resize()});
  }
  function show(id){
    init();$('mapv').style.display='flex';shown=true;
    if(!trk){const t0=Number(lget('crm-trk')||0);if(t0&&Date.now()-t0<14*36e5)startTrk()}
    requestAnimationFrame(()=>{
      resize();hideCard();mt();loadR();
      if(id&&mode!=='pros')setMode('pros');
      if(!mode)setMode('pros');
      const l=id&&S.leads.find(x=>x.id===id);
      if(l&&l.loc){V.cx=mx(l.loc[1]);V.cy=my(l.loc[0]);V.s=Math.max(V.s,0.5);showCard(l);draw()}
      else{fit();const n=pts().length,m=S.leads.filter(x=>x.own===S.ag&&!x.loc).length;say(n+' con ubicación · '+m+' sin ubicación'+(FERDEV()?'':' · '+S.leads.filter(x=>x.own===S.ag&&x.vz).length+' por visitar'))}
    });
  }
  function hide(){if(!inited)return;mode='';mv=null;$('mapv').style.display='none';shown=false;closeFind();$('mrs').className='mfs'}
  function refresh(){if(!shown)return;draw();if(sel){const l=S.leads.find(x=>x.id===sel);if(!l||!l.loc)hideCard()}}
  function filled(id){if(!shown)return;const l=S.leads.find(x=>x.id===id);if(l)showCard(l);draw();say('Datos guardados.')}
  function saved(){pend=null;if(shown){draw();say('Lead guardado con su ubicación.')}}
  return {show:show,hide:hide,refresh:refresh,saved:saved,filled:filled,on:()=>shown};
})();
boot();
setInterval(()=>{if(sheet||!ready)return;const a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'))return;render()},60e3);
setInterval(async()=>{if(!ready||document.hidden||pushing)return;const x=await pull();if(x===true)MAPM.refresh();if(x===true&&!sheet){const a=document.activeElement;if(!(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')))render()}},20e3);

</script>
